name: Public English/Korean language separation

on:
  pull_request:
    paths:
      - "**/*.md"
      - "*.md"
      - "tools/check_language_separation.py"
      - "tools/audit_bilingual_navigation.py"
      - "tools/audit_claim_source_lock.py"
      - "tools/check_external_review_paths.py"
      - "knowledge/claim-source-lock.json"
      - "experiments/e007/timing_summary.json"
      - "experiments/e008/EXECUTABILITY_AUDIT.json"
      - "experiments/e009/RESULT.json"
      - "experiments/e010/RESULT.json"
      - "experiments/e010/run.js"
      - "knowledge/language-edition-register.json"
      - ".github/workflows/language-separation.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "*.md"
      - "tools/check_language_separation.py"
      - "tools/audit_bilingual_navigation.py"
      - "tools/audit_claim_source_lock.py"
      - "tools/check_external_review_paths.py"
      - "knowledge/claim-source-lock.json"
      - "experiments/e007/timing_summary.json"
      - "experiments/e008/EXECUTABILITY_AUDIT.json"
      - "experiments/e009/RESULT.json"
      - "experiments/e010/RESULT.json"
      - "experiments/e010/run.js"
      - "knowledge/language-edition-register.json"
      - ".github/workflows/language-separation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-entry-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate founding-page separation, paired guides and negative mutations
        run: python tools/check_language_separation.py --self-test
      - name: Guard English/Korean external reviewer routes, anchors and four negative mutations
        run: python tools/check_external_review_paths.py --self-test
      - name: Audit all language-edition inventory and paired navigation; challenge five negative mutations
        run: python tools/audit_bilingual_navigation.py --self-test
      - name: Derive four studies' EN/KO published claims from numeric original results and inject six mistakes
        run: python tools/audit_claim_source_lock.py --self-test
      - name: Reject unacknowledged one-sided navigation edition changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # pull_request checks out a synthetic merge commit: parent 1 is the
          # current base; compare against it, not the base SHA frozen when PR opened.
          # Otherwise concurrently merged source files appear as this PR\x27s new files.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]] && git rev-parse -q --verify "HEAD^2" >/dev/null; then
            BASE_SHA="$(git rev-parse "HEAD^1")"
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No comparable baseline; full structure/inventory audit already ran."
            exit 0
          fi
          python tools/audit_bilingual_navigation.py --diff-base "${BASE_SHA}"
      - name: Gate newly added Markdown language editions
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # pull_request checks out a synthetic merge commit: parent 1 is the
          # current base; compare against it, not the base SHA frozen when PR opened.
          # Otherwise concurrently merged source files appear as this PR\x27s new files.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]] && git rev-parse -q --verify "HEAD^2" >/dev/null; then
            BASE_SHA="$(git rev-parse "HEAD^1")"
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No comparable prior commit (initial push); static landing-page guard already ran."
            exit 0
          fi
          mapfile -d '' added < <(git diff --diff-filter=A --name-only -z "${BASE_SHA}" HEAD -- '*.md')
          python tools/check_language_separation.py --added "${added[@]}"
