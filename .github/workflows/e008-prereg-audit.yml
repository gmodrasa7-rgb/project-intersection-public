name: E008 preregistration audit

on:
  pull_request:
    paths:
      - "experiments/e008/**"
      - ".github/workflows/e008-prereg-audit.yml"
  push:
    branches: [main]
    paths:
      - "experiments/e008/**"
      - ".github/workflows/e008-prereg-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-e008:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python experiments/e008/validate.py
