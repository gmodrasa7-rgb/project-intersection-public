name: PICB v1 first-principles benchmark and full-population integrity

on:
  pull_request:
    paths:
      - "experiments/picb_v1/**"
      - ".github/workflows/picb-v1.yml"
  push:
    branches: [main]
    paths:
      - "experiments/picb_v1/**"
      - ".github/workflows/picb-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  picb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core schema, role-label and negative-control self-tests
        run: python experiments/picb_v1/benchmark.py --self-test
      - name: Freeze-before-result enforcement; run only on merged main
        shell: bash
        run: |
          if [[ -f experiments/picb_v1/RESULT.json ]]; then
            python experiments/picb_v1/benchmark.py --verify
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "PICB FIRST SCORED PROJECT-LINEAGE EXECUTION, after pre-result commit"
            echo "PREREG_MAIN_COMMIT=${GITHUB_SHA}"
            git hash-object experiments/picb_v1/benchmark.py
            python experiments/picb_v1/benchmark.py --run
          else
            echo "HOLD: spec PR may execute self-tests only. No scored outcome before main preregistration merge."
          fi
