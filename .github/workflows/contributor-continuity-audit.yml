name: Contributor lineage and sustainability integrity

on:
  pull_request:
    paths:
      - "TECHNOLOGY_PROGRESS_CONTRIBUTOR_CONTINUITY_EN_KO.md"
      - "knowledge/contributor-continuity-register-v1.json"
      - "knowledge/prior-art-rights-register-2026-10-13.json"
      - "tools/validate_contributor_continuity.py"
      - ".github/workflows/contributor-continuity-audit.yml"
  push:
    branches: [main]
    paths:
      - "TECHNOLOGY_PROGRESS_CONTRIBUTOR_CONTINUITY_EN_KO.md"
      - "knowledge/contributor-continuity-register-v1.json"
      - "knowledge/prior-art-rights-register-2026-10-13.json"
      - "tools/validate_contributor_continuity.py"
      - ".github/workflows/contributor-continuity-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research and history
        uses: actions/checkout@v4
      - name: Validate evidence-bound contribution lineage and cost/rights boundaries
        run: python tools/validate_contributor_continuity.py
