name: Power-transition toy regression

on:
  pull_request:
    paths:
      - "experiments/power_transition_probe.py"
      - ".github/workflows/power-transition-toy-check.yml"
  push:
    paths:
      - "experiments/power_transition_probe.py"
      - ".github/workflows/power-transition-toy-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basic-synthetic-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile toy probe
        run: python -m py_compile experiments/power_transition_probe.py
      - name: Verify toy probe branch logic and epistemic guards
        run: python experiments/power_transition_probe.py --verify
