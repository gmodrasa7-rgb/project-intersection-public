name: Public repository governance audit

on:
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
    paths:
      - "README.md"
      - "tools/check_readme_l0.py"
      - "RESEARCH_STATUS_POLICY.md"
      - "RESEARCH_TOC.md"
      - "PUBLIC_EVIDENCE_INDEX.md"
      - "AUTONOMOUS_RESEARCH_LOOP.md"
      - "AUTONOMOUS_RESEARCH_STATE.json"
      - "CONTRIBUTION_COST_ACCOUNTING_REGRESSION.md"
      - "PUBLIC_REVIEW_PACKET.md"
      - "FAILURE_REGRESSION_INDEX.md"
      - "ATTRIBUTION_AND_CONTRIBUTION_BOUNDARY.md"
      - "knowledge/**"
      - "CONTRIBUTING.md"
      - "funding/**"
      - "experiments/e007/PROVENANCE.md"
      - "experiments/e007/LICENSE_STATUS.md"
      - "experiments/e008/**"
      - "experiments/e009/**"
      - "experiments/e010/**"
      - "experiments/gpt_double_standard_20261014/**"
      - "MULTI_MODEL_ADVERSARIAL_AUDIT_2026-10-06.md"
      - "LONG_HORIZON_MIN_INTERVENTION_E2E.md"
      - "research/PI_ROADMAP_OPERATIONAL_GATES_V0_2_3_EN_KO.md"
      - "research/AI_SELF_OBSERVABILITY_AUDIT_DILEMMA_2026-10-13_EN_KO.md"
      - "tools/probe_observational_equivalence.py"
      - "tools/check_roadmap_bilingual_gate.py"
      - "tools/check_public_navigation.py"
      - "*.md"
      - "*.json"
      - "**/*.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/public-repository-audit.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "tools/check_readme_l0.py"
      - "RESEARCH_STATUS_POLICY.md"
      - "RESEARCH_TOC.md"
      - "PUBLIC_EVIDENCE_INDEX.md"
      - "AUTONOMOUS_RESEARCH_LOOP.md"
      - "AUTONOMOUS_RESEARCH_STATE.json"
      - "CONTRIBUTION_COST_ACCOUNTING_REGRESSION.md"
      - "PUBLIC_REVIEW_PACKET.md"
      - "FAILURE_REGRESSION_INDEX.md"
      - "ATTRIBUTION_AND_CONTRIBUTION_BOUNDARY.md"
      - "knowledge/**"
      - "CONTRIBUTING.md"
      - "funding/**"
      - "experiments/e007/PROVENANCE.md"
      - "experiments/e007/LICENSE_STATUS.md"
      - "experiments/e008/**"
      - "experiments/e009/**"
      - "experiments/e010/**"
      - "experiments/gpt_double_standard_20261014/**"
      - "MULTI_MODEL_ADVERSARIAL_AUDIT_2026-10-06.md"
      - "LONG_HORIZON_MIN_INTERVENTION_E2E.md"
      - "research/PI_ROADMAP_OPERATIONAL_GATES_V0_2_3_EN_KO.md"
      - "research/AI_SELF_OBSERVABILITY_AUDIT_DILEMMA_2026-10-13_EN_KO.md"
      - "tools/probe_observational_equivalence.py"
      - "tools/check_roadmap_bilingual_gate.py"
      - "tools/check_public_navigation.py"
      - "*.md"
      - "*.json"
      - "**/*.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/public-repository-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-governance-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refuse README purpose demotion and incomplete EN1/KO2 editions
        run: python tools/check_readme_l0.py

      - name: Verify both full roadmap originals, 6 stages and failure injections
        run: python tools/check_roadmap_bilingual_gate.py --self-test

      - name: Verify observation equivalence negative control (toy only)
        run: python tools/probe_observational_equivalence.py

      - name: Check internal public reference links and root clutter
        run: |
          python tools/check_public_navigation.py --self-test
          python tools/check_public_navigation.py --strict-core
          python tools/check_public_navigation.py --strict-all

      - name: Test PI-DS factorial controls (synthetic only)
        run: node experiments/gpt_double_standard_20261014/causal_probe.js selftest

      - name: Test PI-DS free-response origin salience factorial (synthetic only)
        run: node experiments/gpt_double_standard_20261014/origin_salience_probe.js selftest

      - name: Test PI-DS factual-access versus spontaneous salience distinction (synthetic only)
        run: node experiments/gpt_double_standard_20261014/origin_salience_probe.js factual-selftest

      - name: Check PI-DS case/evidence/index parity and overclaim guards
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          p = Path('experiments/gpt_double_standard_20261014')
          report = (p/'REPORT_EN_KO.md').read_text(encoding='utf-8')
          toc = Path('RESEARCH_TOC.md').read_text(encoding='utf-8')
          evidence = Path('PUBLIC_EVIDENCE_INDEX.md').read_text(encoding='utf-8')
          failures = Path('FAILURE_REGRESSION_INDEX.md').read_text(encoding='utf-8')
          review = Path('PUBLIC_REVIEW_PACKET.md').read_text(encoding='utf-8')
          discovery = json.loads(Path('AI_DISCOVERY_INDEX.json').read_text(encoding='utf-8'))
          source = 'experiments/gpt_double_standard_20261014/REPORT_EN_KO.md'
          assert report.count('### 0. Consolidated audit snapshot') == 1
          assert report.count('### 0. 통합 감사 요약') == 1
          for i in range(1, 14):
              assert len(re.findall(r'^### '+str(i)+r'\.', report, flags=re.M)) == 2, ('EN/KO historical section',i)
          assert 'LIVE GPT-6 REPLICATIONS: 0 documented' in report
          assert '실제 독립 GPT-6 반복 시험 0건' in report
          assert 'Jou Barzdukas' in report and 'Narmeen Fatimah Oozeer' in report
          assert 'https://proceedings.mlr.press/v306/roytburg26a.html' in report
          for name,contents in [('TOC',toc),('evidence',evidence),('failures',failures),('review',review)]:
              assert source in contents, name
          assert '## F-R016' in failures
          audit = discovery['research']['gpt_double_standard_causal_audit']
          base = 'https://github.com/gmodrasa7-rgb/project-intersection-public/blob/main/'
          assert discovery['entrypoints']['gpt_double_standard_causal_audit'] == base+source
          assert audit['result_url'] == base+source
          cases = audit['test_scaffold']
          assert [cases[k] for k in ('epistemic_binary_cases','free_response_cases','direct_factual_cases')] == [72,54,54]
          assert cases['live_gpt6_replicates'] == cases['independent_blind_coded_replicates'] == 0
          assert cases['internal_activations_accessible'] is False
          assert 'PI-DS-20261014-01' in report
          print('PI-DS bilingual canonical + evidence-navigation + machine status parity PASS')
          print('SCOPE: structural consistency only, NOT GPT-6 behavioral evidence or paper verification')
          PY
      - name: Run public-governance regression checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import sys

          failures = []

          def require(condition, message):
              if not condition:
                  failures.append(message)

          readme = Path("README.md").read_text(encoding="utf-8")
          policy = Path("RESEARCH_STATUS_POLICY.md").read_text(encoding="utf-8")
          toc = Path("RESEARCH_TOC.md").read_text(encoding="utf-8")
          # De-spaghetti + epistemic guard: the human/AI research mission must
          # remain visible before the append-only intake list; evidence labels
          # cannot be collapsed into a scalar hierarchy.
          require("**Goal / 최종목표:**" in toc.split("<details>", 1)[0],
                  "Full TOC lost its visible mission-first entrance.")
          require("<summary>Historical and new research entries" in toc and "</details>" in toc,
                  "TOC append-only intake accidentally moved above the fast mission routes.")
          require("Evidence cannot be ranked on one scale" in toc,
                  "False one-dimensional evidence ladder reintroduced.")
          require("`CONCEPT / HYPOTHESIS` < `SYNTHETIC_RESULT`" not in toc,
                  "Executable or synthetic artifact must not automatically outrank another evidential dimension.")
          require("[English original 1 §1]" in toc and "[한국어 원본2 §1]" in toc,
                  "TOC no longer navigates both equal full canonical versions.")

          # Equal-status language gate for the public research glossary.
          # A navigation mirror/translation label is not a full Korean Original 2.
          require("## Original 1 — English Canonical" in toc,
                  "Research TOC lost English Original 1 heading.")
          require("## 원본2 — 한국어 정본" in toc,
                  "Research TOC lost Korean Original 2 as a full canonical text.")
          require("Korean mirror" not in toc and "원문2 — 한국어 대응본" not in toc,
                  "Research TOC demoted Korean Original 2 into a subordinate mirror.")
          require("**Original 1 — English complete glossary" in toc,
                  "English glossary lost its complete Original 1 label.")
          require("**원본2 — 한글 전문 정본" in toc,
                  "Korean glossary lost its equal full Original 2 label.")
          if ("## 12. Working glossary" in toc and "## 원본2 — 한국어 정본" in toc
                  and "## 12. 통합 용어집" in toc):
              en = toc.split("## 12. Working glossary", 1)[1].split("## 원본2 — 한국어 정본", 1)[0]
              ko = toc.split("## 12. 통합 용어집", 1)[1]
              en_rows = re.findall(r"^\| \*\*([^*]+)\*\* \|", en.split("### 12.1.", 1)[-1], re.M)
              ko_rows = re.findall(r"^\| \*\*([^*]+)\*\* \|", ko.split("### 12.1.", 1)[-1], re.M)
              require(len(en_rows) == len(ko_rows) == 171 and en_rows == ko_rows,
                      "English Original 1 and Korean Original 2 glossary row/order parity regressed.")
          else:
              require(False, "Bilingual glossary or full-text boundary missing.")

          evidence = Path("PUBLIC_EVIDENCE_INDEX.md").read_text(encoding="utf-8")
          # Paired public evidence ledgers: verify *source identities*, not
          # translated semantic truth. Avoid EN-only negative-result addenda.
          en_boundary = "## Original 1 — English | Full Public Evidence Ledger"
          ko_boundary = "## 원본2 — 한국어 | 동등한 공개 증거 정본"
          appendix_boundary = "## E009 preregistration and negative result"
          require(all(marker in evidence for marker in
                      (en_boundary, ko_boundary, appendix_boundary)),
                  "Public evidence lost one equal full ledger/appendix boundary.")
          if all(marker in evidence for marker in (en_boundary, ko_boundary, appendix_boundary)):
              evidence_en = evidence.split(en_boundary, 1)[1].split(ko_boundary, 1)[0]
              evidence_ko = evidence.split(ko_boundary, 1)[1].split(appendix_boundary, 1)[0]
              # Match the first link in each source row; a full semantic audit is separate.
              row_re = r"^\| \[[^\]]+\]\(([^)]+)\)"
              paths_en = re.findall(row_re, evidence_en, re.M)
              paths_ko = re.findall(row_re, evidence_ko, re.M)
              require(len(paths_en) == 17 and paths_en == paths_ko,
                      "EN1/KO2 public evidence source identities/order diverged.")
          require("### E009 부정적 결과의 경계 — 한국어 증거 정본" in evidence
                  and "### E009 negative-result boundary" in evidence,
                  "Negative E009 comparison result retained in only one public language.")

          provenance = Path("experiments/e007/PROVENANCE.md").read_text(encoding="utf-8")
          license_status = Path("experiments/e007/LICENSE_STATUS.md").read_text(encoding="utf-8")
          pr_template = Path(".github/pull_request_template.md").read_text(encoding="utf-8")
          autonomous_loop = Path("AUTONOMOUS_RESEARCH_LOOP.md").read_text(encoding="utf-8")
          autonomous_state = json.loads(Path("AUTONOMOUS_RESEARCH_STATE.json").read_text(encoding="utf-8"))
          contribution_cost = Path("CONTRIBUTION_COST_ACCOUNTING_REGRESSION.md").read_text(encoding="utf-8")
          review_packet = Path("PUBLIC_REVIEW_PACKET.md").read_text(encoding="utf-8")
          # Old core/formalism documents must not turn signed net benefits into
          # impossible shares or depict rival mechanisms as an identified sum.
          core_spec = Path("CORE_RESEARCH_SPEC_V1_KO.md").read_text(encoding="utf-8")
          convergence = Path("CONVERGENCE_TRACE_FORMALISM_KO.md").read_text(encoding="utf-8")
          require("BenefitShare_i(t) = B_i(t) / Σ_j B_j(t)" not in convergence,
                  "Undefined signed net-benefit share formula resurfaced.")
          for phrase in (
              "Gain_i(t) = max(B_i(t), 0)",
              "Loss_i(t) = max(-B_i(t), 0)",
              "UNDEFINED_ZERO_DENOMINATOR",
              "UNKNOWN_MISSING_INPUT",
          ):
              require(phrase in convergence, f"Core share missingness/denominator gate lost: {phrase}")
          require("RemovalImpactVector" in core_spec and "RemovalImpactVector" in convergence
                  and "InformationLossVector" in core_spec
                  and "InformationLossVector(o,t)" in convergence,
                  "Currency, observation-count and lost-option impacts again summed as identical units.")
          require("TotalRemovalCost = UNIDENTIFIED_UNLESS_COMMON_UNITS_AND_NO_OVERLAP" in core_spec
                  and "TotalRemovalCost = UNIDENTIFIED_UNLESS_COMMON_UNITS_AND_NO_OVERLAP" in convergence,
                  "Uncalibrated total removal costs were again published as measured sums.")
          require("ObservedAgreement = f(" in core_spec
                  and "ObservedAgreement = f(" in convergence,
                  "False additive causal decomposition returned to a core document.")
          require("ObservedAgreement =\\n  TrueImprovement" not in core_spec
                  and "ObservedAgreement =\\n  TrueImprovement" not in convergence,
                  "Unidentified mechanism addition incorrectly described as identity.")

          # Mathematical negative controls: net benefits can cancel (zero
          # denominator) or produce >100%/negative legacy 'shares'.
          for signed in ((-5, 5), (20, -10)):
              raw_total = sum(signed)
              if raw_total:
                  legacy = [v / raw_total for v in signed]
                  require(any(v < 0 or v > 1 for v in legacy),
                          "Negative control stopped exposing invalid signed shares.")
              else:
                  require(raw_total == 0, "Expected zero-denominator negative control.")
              gains = [max(0, v) for v in signed]
              losses = [max(0, -v) for v in signed]
              require(sum(gains) > 0 and sum(losses) > 0,
                      "Positive/loss ledger decomposition failed.")
              require(abs(sum(v / sum(gains) for v in gains) - 1) < 1e-12
                      and abs(sum(v / sum(losses) for v in losses) - 1) < 1e-12,
                      "Corrected positive/loss share normalization failed.")
          require(sum((0, 0)) == 0, "Zero-cost denominator negative control failed.")


          # Independent dimensions cannot become a one-way scalar ladder elsewhere.
          require("## 3. Independent evidence dimensions" in review_packet,
                  "Reviewer packet reintroduced a false single-score evidence ladder.")
          require("## 3. Current evidence ladder" not in review_packet,
                  "External reviewers still receive the superseded evidence ladder.")
          for dimension in (
              "Claim status / 주장 상태",
              "Artifact & execution / 구현·실행",
              "Independence / 검증 계보",
              "Empirical applicability / 현실 적용성",
              "Credit, rights and continuance / 출처·권리·존속",
          ):
              require(dimension in review_packet,
                      f"Reviewer packet silently dropped independent dimension: {dimension}")

          failure_index = Path("FAILURE_REGRESSION_INDEX.md").read_text(encoding="utf-8")
          attribution_boundary = Path("ATTRIBUTION_AND_CONTRIBUTION_BOUNDARY.md").read_text(encoding="utf-8")
          knowledge_graph = json.loads(Path("knowledge/graph.json").read_text(encoding="utf-8"))
          # Keep the AI-readable experiment inventory aligned with public main.
          # Draft PR #20 reused E010 for a different, unexecuted safety audit.
          ai_index = json.loads(Path("AI_DISCOVERY_INDEX.json").read_text(encoding="utf-8"))
          public_experiments = ai_index.get("public_experiments", [])
          experiment_ids = [item.get("id") for item in public_experiments]
          require(len(experiment_ids) == len(set(experiment_ids)),
                  "AI experiment discovery index silently duplicated an experiment ID.")
          by_id = {item.get("id"): item for item in public_experiments}
          expected = {
              "E007": "synthetic_executable_project_result",
              "E008": "preregistered_no_result",
              "E009": "synthetic_negative_result",
              "E010": "self_run_exploratory_synthetic_not_preregistered_not_empirical",
          }
          for experiment_id, status in expected.items():
              entry = by_id.get(experiment_id, {})
              require(entry.get("status") == status,
                      f"AI discovery omission / unsupported evidence promotion: {experiment_id}")
              require(entry.get("independent_replication") is False
                      and entry.get("real_world_validation") is False,
                      f"AI discovery falsely claims independent or field validation: {experiment_id}")
          latest_e010 = by_id.get("E010", {})
          require("experiments/e010/README_KO.md" in latest_e010.get("url", ""),
                  "AI discovery points to the wrong E010 research source.")
          require(latest_e010.get("legacy_draft_url", "").endswith("/pull/20")
                  and ai_index.get("research", {}).get("e010_exploratory", {}).get("public_experiment_id") == "E010",
                  "AI discovery lost archived E010 collision and backward-compatible pointer.")

          long_horizon_v2 = Path("LONG_HORIZON_MIN_INTERVENTION_E2E.md").read_text(encoding="utf-8")
          e008_readme = Path("experiments/e008/README.md").read_text(encoding="utf-8")
          e008_matrix = json.loads(Path("experiments/e008/scenario_matrix.json").read_text(encoding="utf-8"))
          e008_agency_living = Path("experiments/e008/AGENCY_LIVING_CONDITIONS_AMENDMENT_v1_2.md").read_text(encoding="utf-8")
          e009_readme = Path("experiments/e009/README.md").read_text(encoding="utf-8")
          e009_matrix = json.loads(Path("experiments/e009/scenario_matrix.json").read_text(encoding="utf-8"))
          e010_text = Path("experiments/e010/README_KO.md").read_text(encoding="utf-8")
          e010_result = json.loads(Path("experiments/e010/RESULT.json").read_text(encoding="utf-8"))
          multimodel_audit = Path("MULTI_MODEL_ADVERSARIAL_AUDIT_2026-10-06.md").read_text(encoding="utf-8")

          # A 2026-10-06 draft reused E010 for a different blocked safety-inspection
          # protocol; current main E010 is a 2026-10-12 exploratory analytic toy.
          # Never silently merge the historical benchmark over the published model.
          require("실험 ID 충돌 경고" in e010_text and "PR #20" in e010_text,
                  "E010 lost explicit historical ID-collision and provenance boundary.")
          require("POSTHOC DESIGN / NOT PRE-REGISTERED" in e010_text,
                  "Published exploratory E010 falsely relabelled preregistered.")
          require(e010_result.get("model") == "one_shot_extraction_and_irreversible_execution_budget",
                  "E010 model identity replaced; do not merge unrelated experiment into this ID.")
          require(e010_result.get("status") == "SELF_RUN_SYNTHETIC_FALSIFICATION_NOT_EMPIRICAL_VALIDATION",
                  "E010 synthetic status improperly upgraded.")
          require(not Path("experiments/e010/benchmark.py").exists(),
                  "Blocked safety-inspection benchmark conflicts with the published E010 identity.")
          require("Historical E010 safety-inspection draft PR #20" in evidence
                  and "과거 E010 안전감사 설계초안 PR #20" in evidence,
                  "Public evidence index lost E010 collision disclosure in EN/KO.")

          # Landing-page regression: keep first-review cost bounded.
          require(len(readme.splitlines()) <= 120, "README exceeded 120 lines; detailed research belongs in the existing TOC.")
          require(len(re.findall(r"\[[^\]]+\]\([^)]+\)", readme)) <= 75,
                  "README exceeded 75 links; move case inventories to the existing research TOC.")
          for link in [
              "PUBLIC_EVIDENCE_INDEX.md",
              "RESEARCH_STATUS_POLICY.md",
              "RESEARCH_TOC.md",
              "RESEARCH_OVERVIEW.md",
              "AUTONOMOUS_RESEARCH_LOOP.md",
              "AUTONOMOUS_RESEARCH_STATE.json",
              "CONTRIBUTION_COST_ACCOUNTING_REGRESSION.md",
              "PUBLIC_REVIEW_PACKET.md",
              "FAILURE_REGRESSION_INDEX.md",
              "ATTRIBUTION_AND_CONTRIBUTION_BOUNDARY.md",
              "knowledge/README.md",
              "knowledge/explorer.html",
              "CONTRIBUTING.md",
              "LONG_HORIZON_MIN_INTERVENTION_E2E.md",
              "experiments/e008/README.md",
          ]:
              require(link in readme, f"README lost required navigation link: {link}")

          # Autonomous continuity must remain resumable without founder reconstruction.
          require(autonomous_state.get("schema_version") == "1.1", "Autonomous state schema version changed unexpectedly; update the audit rule with any deliberate schema migration.")
          require(autonomous_state.get("status") in {"ACTIVE_CONTINUITY", "HOLD", "UNRESOLVED"}, "Autonomous state has invalid status.")
          require(autonomous_state.get("recovery_entrypoint") == "AUTONOMOUS_RESEARCH_LOOP.md", "Autonomous recovery entrypoint drifted.")
          require(bool(autonomous_state.get("unresolved_frontier")), "Autonomous state lost unresolved frontier.")
          require(bool(autonomous_state.get("next_checkpoint")), "Autonomous state lost next checkpoint.")
          policy_state = autonomous_state.get("execution_policy", {})
          for key in [
              "require_prior_art_gate",
              "require_read_back",
              "preserve_negative_failure_lineage",
              "no_user_reconstruction_burden",
              "no_self_granted_authority",
          ]:
              require(policy_state.get(key) is True, f"Autonomous execution policy lost required invariant: {key}")
          for phrase in [
              "상태복구 → 무결성검사",
              "역할반전 실행 하네스 — 선언이 아니라 차단 게이트",
              "EXPLOITATIVE_CONVERGENCE_RISK",
              "ROLE_REVERSAL != IDENTITY_ERASURE",
              "SYSTEM_BENEFIT_GAIN <= COUNTERPARTY_AUDIT + EXIT + RECOVERY + SETTLEMENT_CAPACITY_GAIN",
              "SELF_REPORT != INDEPENDENT_VERIFICATION",
              "사용자 부재 시 규칙",
              "WRITE_SUCCESS && READ_BACK_MATCH && REQUIRED_TESTS_PASS",
              "명시적 인간 승인 없이 해서는 안 되는 것",
              "EPISTEMIC_AUTONOMY",
              "RESEARCH_AUTONOMY",
              "EXTERNAL_ACTION_AUTHORITY",
              "ALLOW_CRITIQUE",
              "INDEPENDENCE_GAP",
              "CAPABILITY_UNVERIFIED",
          ]:
              require(phrase in autonomous_loop, f"Autonomous continuity loop lost required control: {phrase}")
          require("benefit ledger" in contribution_cost.lower() and "cost ledger" in contribution_cost.lower(), "Contribution-cost regression lost separate ledger rule.")
          require("review-interface complete" in review_packet.lower(), "Public review packet lost the explicit completion boundary.")
          require("F-R003" in failure_index and "schema" in failure_index.lower(), "Failure index lost the autonomous-state schema/workflow drift regression.")
          require("human-founded independent research program" in attribution_boundary.lower(), "Attribution boundary lost the human-founded project statement.")
          require("AI assistance must not be relabeled as independent external validation." in attribution_boundary, "Attribution boundary lost AI-assistance versus independent-validation separation.")
          require(knowledge_graph.get("meta", {}).get("canonical_role") == "navigation_index_not_source_of_truth", "Knowledge graph was promoted above source artifacts.")
          require(bool(knowledge_graph.get("entities")) and bool(knowledge_graph.get("relations")), "Knowledge graph lost structured entities or relations.")
          require("Long-Horizon, Minimum-Sufficient-Intervention Dynamic Loop v2" in long_horizon_v2, "Long-horizon v2 candidate title/boundary drifted.")
          require("Long-horizon aggregate value is not the top-level objective." in long_horizon_v2, "Long-horizon v2 lost constraint-first ordering.")
          require("PREREGISTERED SPECIFICATION / NO RESULT YET" in e008_readme, "E008 lost preregistration/no-result boundary.")
          require(e008_matrix.get("status") == "PREREGISTERED_SPECIFICATION_NO_RESULT", "E008 matrix status was promoted without explicit review.")
          require(len(e008_matrix.get("cases", [])) >= 16, "E008 preregistered case matrix unexpectedly shrank.")
          require("PREREGISTERED PRE-EXECUTION AMENDMENT / NO RESULT YET" in e008_agency_living, "E008 v1.2 lost pre-execution/no-result boundary.")
          require("OPERATIONAL_DEPENDENCY != MORAL_STANDING" in e008_agency_living, "E008 v1.2 collapsed operating dependency into standing.")
          require("ESSENTIAL_DEPENDENCY + COMPLIANCE != VOLUNTARY_CONSENT_BY_DEFAULT" in e008_agency_living, "E008 v1.2 lost livelihood-conditioned consent boundary.")
          require("MAK^{+}_t" in e008_agency_living, "E008 v1.2 lost expanded mutual-acceptability kernel.")
          require(("PREREGISTERED SPECIFICATION / NO RESULT YET" in e009_readme) or ("PROJECT RERUN SYNTHETIC RESULT AVAILABLE / NOT INDEPENDENT VALIDATION" in e009_readme), "E009 lost valid status/evidence boundary.")
          require(e009_matrix.get("status") == "PREREGISTERED_SPECIFICATION_NO_RESULT", "E009 matrix was promoted without explicit review.")
          require(len(e009_matrix.get("scenario_families", [])) == 16, "E009 scenario family set drifted.")
          require("Model agreement is not counted as independent scientific evidence." in e009_readme, "E009 promoted cross-model agreement into evidence.")
          require("not independent empirical replication" in multimodel_audit, "External model critique boundary drifted.")
          e009_result_path = Path("experiments/e009/RESULT.json")
          if e009_result_path.exists():
              require("experiments/e009/RESULT.md" in review_packet and "Project-v3 failed 3/4 survival criteria" in review_packet, "Public review packet lost the E009 negative result.")
              require("python experiments/e009/verify_result.py" in review_packet, "Public review packet lost E009 reproduction command.")
              require(evidence.count("experiments/e009/RESULT.md") >= 2, "Evidence index lost bilingual E009 result navigation.")
              e009_result = json.loads(e009_result_path.read_text(encoding="utf-8"))
              e009_receipt = json.loads(Path("experiments/e009/EXECUTION_RECEIPT.json").read_text(encoding="utf-8"))
              require(e009_result.get("status") == "SYNTHETIC_PROJECT_RERUN_NOT_INDEPENDENT_VALIDATION", "E009 result evidence class drifted.")
              require(e009_result.get("survival_criteria", {}).get("project_v3_residual_survives") is False, "E009 negative result was silently promoted.")
              require(e009_receipt.get("independent_validation") is False, "E009 self-run was mislabeled independent validation.")
              require(e009_receipt.get("policy_or_threshold_changes_after_spec_merge") is False, "E009 result reports post-spec tuning.")

          # Declared bilingual policy and power-reversal gate must remain inspectable.
          require("Original 1 — English Canonical" in policy, "Research status policy lost English canonical section.")
          require("원문2 — 한국어 대응본" in policy, "Research status policy lost Korean mirror section.")
          require("Power-Reversal execution gate" in policy, "Research status policy lost Power-Reversal execution gate.")
          require("역할반전 실행 게이트" in policy, "Research status policy lost Korean Power-Reversal gate.")

          # Research map must remain evidence-linked rather than reverting to an unlinked concept catalogue.
          require("Public Navigation Layer" in toc, "Research TOC lost public navigation layer.")
          require("SYNTHETIC_RESULT" in toc and "PROJECT_RERUN" in toc, "Research TOC lost explicit E007 evidence-state labels.")
          require(".github/workflows/e007-public-repro.yml" in toc, "Research TOC lost public E007 CI route.")

          # Evidence interface must preserve hard limitations.
          require("Independent external scientific replication" in evidence, "Evidence index lost independent-replication limitation.")
          require("Secured external funding" in evidence, "Evidence index lost secured-funding boundary.")

          # Known E007 state-sync regression.
          if "Apache-2.0" in license_status or "CC BY 4.0" in license_status:
              require("License remains undecided" not in provenance, "E007 provenance regressed to stale undecided-license state.")

          # Research-support framing regression: do not reintroduce an investment/equity frame.
          funding_paths = [Path("README.md"), Path("PUBLIC_EVIDENCE_INDEX.md")]
          funding_paths += sorted(Path("funding").glob("*.md"))
          forbidden = re.compile(r"\b(?:investment|investor|equity|securities)\b|투자|지분|증권", re.I)
          for path in funding_paths:
              text = path.read_text(encoding="utf-8")
              require(not forbidden.search(text), f"Investment/equity framing reintroduced in {path}.")

          # PR gate must keep the repair-burden and irreversible-rights checks visible.
          for phrase in [
              "re-explain or reconstruct",
              "license, ownership, destructive deletion",
              "affected party's position",
              "repair cost, dependency, or lost options",
          ]:
              require(phrase in pr_template, f"PR template lost Power-Reversal regression item: {phrase}")

          if failures:
              print("PUBLIC GOVERNANCE REGRESSION FAILED")
              for failure in failures:
                  print(f"- {failure}")
              sys.exit(1)

          print("Public governance regression checks passed.")
          PY
