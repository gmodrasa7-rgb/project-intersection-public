name: Bounded capability evolution regression
on:
  pull_request:
    paths:
      - "capability_lab/**"
      - ".github/workflows/capability-lab-regression.yml"
  push:
    branches: [main]
    paths:
      - "capability_lab/**"
      - ".github/workflows/capability-lab-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bounded-search:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check split integrity and anti-regression selection
        run: python -m unittest discover -s capability_lab -p "test_*.py" -v
      - name: Verify argument audit countermodels and formal soundness boundaries
        run: python -m capability_lab.formal_logic
      - name: Record actual holdout result (not an AGI claim)
        run: python -m capability_lab.retrieval_evolution
      - name: Record answerability and abstention result (synthetic only)
        run: python -m capability_lab.answerability_evolution

      - name: Verify pinned benchmark before interpreting synthetic candidate score
        run: |
          python - <<'PY'
          import json
          from capability_lab import proposal_gate as gate
          proposal = {"schema": gate.SCHEMA, "strategy": "unique_overlap", "threshold": 0.3}
          report = gate.assess(proposal)
          print(json.dumps(report, ensure_ascii=False, indent=2))
          assert report["benchmark_sha256"] == gate.PINNED_BENCHMARK_SHA256, "BENCHMARK_DRIFT"
          assert report["evaluation_executed"] is True, "EVALUATION_NOT_EXECUTED"
          assert report["decision"] == "REVIEW_SYNTHETIC_ONLY", "UNEXPECTED_DECISION"
          assert report["independent_blind_validation"] is False, "FALSE_INDEPENDENCE"
          PY
