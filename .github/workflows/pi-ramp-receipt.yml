name: PI-RAMP source, evidence-unit and receipt regressions

on:
  pull_request:
    paths:
      - "protocols/PI_RAMP_V0_3_*.md"
      - "protocols/PI_RAMP_V0_4_EN_KO.md"
      - "protocols/PI_RAMP_V0_5_EN_KO.md"
      - "protocols/PI_RAMP_V0_6_EN_KO.md"
      - "research/PRIOR_ART_*2026-10-20.json"
      - "evaluation/pi_ramp/**"
      - "tools/check_pi_ramp_receipts.py"
      - "tools/audit_prior_art_c01_c12_identity.py"
      - "tools/audit_pi_ramp_study_lineage.py"
      - "tools/audit_pi_ramp_veto_identification.py"
      - ".github/workflows/pi-ramp-receipt.yml"
  push:
    branches: [main]
    paths:
      - "protocols/PI_RAMP_V0_3_*.md"
      - "protocols/PI_RAMP_V0_4_EN_KO.md"
      - "protocols/PI_RAMP_V0_5_EN_KO.md"
      - "protocols/PI_RAMP_V0_6_EN_KO.md"
      - "research/PRIOR_ART_*2026-10-20.json"
      - "evaluation/pi_ramp/**"
      - "tools/check_pi_ramp_receipts.py"
      - "tools/audit_prior_art_c01_c12_identity.py"
      - "tools/audit_pi_ramp_study_lineage.py"
      - "tools/audit_pi_ramp_veto_identification.py"
      - ".github/workflows/pi-ramp-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-receipt-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate v0.3 pilot receipt
        run: python tools/check_pi_ramp_receipts.py
      - name: Reject 9 falsified receipt mutations
        run: python tools/check_pi_ramp_receipts.py --self-test
      - name: Audit 233 original-author record identities and six title-related contrasts
        run: python tools/audit_prior_art_c01_c12_identity.py
      - name: Reject 11 dangerous DOI, claim and study-dedup mutations
        run: python tools/audit_prior_art_c01_c12_identity.py --self-test
      - name: Audit v0.5 partial-replication, modality and cross-domain lineage
        run: python tools/audit_pi_ramp_study_lineage.py
      - name: Reject 17 false-replication and overgeneralization mutations
        run: python tools/audit_pi_ramp_study_lineage.py --self-test
      - name: Verify 48-cell intrinsic-rights versus private-self-image nonidentification
        run: python tools/audit_pi_ramp_veto_identification.py
      - name: Reject 18 invalid inference and autonomy-erasure mutations
        run: python tools/audit_pi_ramp_veto_identification.py --self-test
