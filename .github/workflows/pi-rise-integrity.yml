name: PI-RISE synthetic-only integrity
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit regression tests (no credentials, network services or real finances)
        run: python3 -m unittest discover -s tests -p 'test_pi_rise_*.py' -v
      - name: Enforce PI-RISE canonical pointers, Git blob hashes and publication contract
        run: python3 tools/pi_rise_manifest_guard.py
      - name: Verify minimal cut sets are model-conditional and countable
        run: |
          python3 tools/pi_rise_cutset.py > /tmp/pi_rise_cutset.json
          python3 -c 'import json; x=json.load(open("/tmp/pi_rise_cutset.json")); assert x["status"] == "SYNTHETIC_FAULT_TREE_MODEL_ONLY"; assert len(x["active_research_cut_sets"]) == 6; assert len(x["record_cut_sets"]) == 1'
      - name: Budget scenario guard
        run: |
          python3 tools/pi_rise_budget.py > /tmp/pi_rise_budget.json
          python3 -c 'import json; x=json.load(open("/tmp/pi_rise_budget.json")); assert x["minimum_20pc"]["monthly_usd"] == "3785.00"; assert x["small_review_20pc"]["monthly_usd"] == "4265.00"; assert x["preserved_5000_bridge_comparison"]["personal_net_shortfall_usd"] == "440.00"'
      - name: Check verification-debt model remains hypothetical
        run: |
          python3 tools/pi_rise_vac.py > /tmp/pi_rise_vac.json
          python3 -c 'import json; x=json.load(open("/tmp/pi_rise_vac.json")); assert x["status"]=="FORMAL_TOY_NOT_FIELD_VALIDATED"; assert x["month_budget"]["total_usd_month"]=="4850.00"; assert x["high_generation_same_review"]["last_backlog"]==16; assert x["low_generation"]["last_backlog"]==0'
      - name: Guard PI-RISE funding metadata (not actual bank attestation)
        run: |
          python3 tools/pi_rise_finance_audit.py operations/PI_RISE_FINANCE_PIPELINE_V0_1_0.json --check-paths > /tmp/pi_rise_finance_status.json
          python3 -c 'import json; x=json.load(open("/tmp/pi_rise_finance_status.json")); assert x["result"] == "STRUCTURE_ONLY_NOT_EXTERNAL_VERIFICATION"; assert x["cash_aggregation_performed"] is False; assert x["stage_counts"]["PAID_VERIFIED"] == 0'
      - name: Verify time-to-usable-cash discovery cannot imply payment or submission
        run: |
          python3 tools/pi_rise_opportunity_audit.py operations/PI_RISE_OPPORTUNITY_REGISTRY_V0_1_0.json > /tmp/pi_rise_opportunities.json
          python3 -c 'import json; x=json.load(open("/tmp/pi_rise_opportunities.json")); assert x["status"] == "OFFLINE_METADATA_INVARIANTS_ONLY"; assert x["funder_pages_recorded"] == 3; assert x["submission_verified"] is False and x["award_verified"] is False and x["bank_receipt_verified"] is False and x["arrival_time_inferred"] is False'
      - name: Verify liquidity prefix and review-hour synthetic counterexamples
        run: |
          python3 tools/pi_rise_dual_clock.py > /tmp/pi_rise_dc.json
          python3 -c 'import json; x=json.load(open("/tmp/pi_rise_dc.json")); assert x["empirical_status"]=="TOY_SCENARIOS_ONLY"; assert x["delayed_payment"]["minimum_initial_cash_by_pool_usd"]["unrestricted"]=="3950.00"; assert x["delayed_payment"]["minimum_initial_cash_by_pool_usd"]["restricted_project"]=="900.00"; assert x["one_hard_claim"]["history"][0]["unreviewed_hours"]=="12.00"; assert x["five_easy_claims"]["history"][0]["completed_claims"]==5'
      - name: Verify synthetic example expected status
        run: |
          python3 tools/pi_rise_check.py operations/PI_RISE_SYNTHETIC_EXAMPLE_V0_1_0.json > /tmp/pi_rise_synthetic_result.json
          python3 -c 'import json; x=json.load(open("/tmp/pi_rise_synthetic_result.json")); assert x["example_is_synthetic"] is True; assert x["overall"] == "CONSERVE"; assert x["pipeline_counted_as_cash"] is False'
