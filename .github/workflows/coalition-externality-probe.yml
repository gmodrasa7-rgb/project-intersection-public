name: Coalition externality probe

on:
  pull_request:
    paths:
      - "experiments/coalition_externality_probe/**"
      - ".github/workflows/coalition-externality-probe.yml"
      - "PUBLIC_EVIDENCE_INDEX.md"
  push:
    branches: [main]
    paths:
      - "experiments/coalition_externality_probe/**"
      - ".github/workflows/coalition-externality-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deterministic self-checks and result receipt
        run: |
          python experiments/coalition_externality_probe/probe.py --verify > /tmp/pi-coalition-externality.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/pi-coalition-externality.json").read_text())
          assert data["self_checks_passed"] == 65
          assert data["counts"] == {
              "total": 10,
              "member_select": 9,
              "aggregate_select": 8,
              "guard_admissible": 3,
              "guard_blocked": 6,
              "guard_unresolved": 1,
          }
          print("RESULT: project-authored deterministic synthetic probe PASS")
          PY

      - name: Run partial-identification and role-reversal finite oracle (v0.2)
        run: |
          python experiments/coalition_externality_probe/partial_identification_audit_v02.py > /tmp/pi-coalition-v02.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/pi-coalition-v02.json").read_text(encoding="utf-8"))
          assert data["finite_states_tested"] == 108864
          assert data["formula_oracle_disagreements"] == 0
          assert data["member_identity_swap_disagreements"] == 0
          w = data["unregistered_actor_witness"]
          assert w["observed"] == {"A": 4, "B": 4, "C": 0}
          assert w["completion_D_plus5_all_nonnegative"] is True
          assert w["completion_D_minus50_all_nonnegative"] is False
          assert data["old_v01_masking_observations"] == {
              "member_loss_c_missing": "UNRESOLVED",
              "exit_c_missing": "UNRESOLVED",
          }
          # The frozen v0.1 decisions remain recorded; unknown affected
          # scope cannot be promoted to a positive v0.2 clearance.
          from collections import Counter
          legacy = data["legacy_v01_reassessment_open_scope"]
          assert len(legacy) == 10 and len({r["id"] for r in legacy}) == 10
          assert Counter(r["legacy_v01_guard"] for r in legacy) == {
              "ADMISSIBLE": 3, "BLOCKED": 6, "UNRESOLVED": 1,
          }
          assert Counter(r["v02_open_scope_guard"] for r in legacy) == {
              "UNRESOLVED": 4, "BLOCKED": 6,
          }
          assert all(r["affected_scope_complete"] is None for r in legacy)
          changed = {r["id"] for r in legacy
                     if r["legacy_v01_guard"] != r["v02_open_scope_guard"]}
          assert changed == {"win_all", "consented_bounded_loss",
                             "zero_member_incentive"}
          assert all(r["legacy_v01_guard"] == "ADMISSIBLE"
                     and r["v02_open_scope_guard"] == "UNRESOLVED"
                     for r in legacy if r["id"] in changed)
          print("Legacy v0.1 -> v0.2 open-scope reassessment PASS; 3 positive claims downgraded")
          cases = {x["case"]: x["classification"] for x in data["focused_cases"]}
          assert cases["known_member_loss_hidden_by_missing_C"] == "BLOCKED"
          assert cases["known_exit_block_hidden_by_missing_C"] == "BLOCKED"
          assert cases["positive_C_but_unverified_affected_register"] == "UNRESOLVED"
          assert cases["unknown_C_bounded_nonnegative"] == "ADMISSIBLE"
          assert cases["known_unavoidable_C_loss"] == "BLOCKED"
          print("v0.2 finite-world self-audit PASS; only project-authored synthetic evidence")
          PY


      - name: Check ex-ante coalition and ex-post enforcement counterexamples (exploratory v0.1)
        run: |
          python experiments/coalition_externality_probe/credible_coalition_probe_v01.py > /tmp/pi-credible-coalition.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/pi-credible-coalition.json").read_text(encoding="utf-8"))
          assert data["schema"] == "pi-credible-coalition-exploratory/v0.1"
          assert data["checks"] == 116
          assert data["status"].startswith("PROJECT_SYNTHETIC_POST_HOC")
          x = {v["parameters"]["name"]: v for v in data["cases"]}
          def names(s):
              return {r["members"] for r in x[s]["ex_ante_pure_nash_equilibria"]}
          assert names("declared_high_credibility_but_no_ex_post_incentive") == {"NONE"}
          assert names("credible_coalition_two_equilibria") == {"NONE", "CD"}
          assert names("defense_displaces_attack_to_E") == {"NONE", "CD"}
          assert names("maintenance_cost_destroys_full_coalition_equilibrium") == {"NONE"}
          assert x["defense_displaces_attack_to_E"]["all_join_counterfactual"]["target"] == "E"
          assert x["E_attack_unreported"]["all_join_counterfactual"]["observed_attack_probability"] == 0
          assert x["no_prior_incentive_to_attack"]["none_join_counterfactual"]["target"] == "NONE"
          print("Synthetic credible-response cases PASS; no empirical or independent-replication claim")
          PY


      - name: Audit harmed outsider E under fixed private coalition equilibrium (post-hoc sensitivity)
        run: |
          python experiments/coalition_externality_probe/heterogeneous_externality_sensitivity_v01.py > /tmp/pi-coalition-third-party-harm.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("/tmp/pi-coalition-third-party-harm.json").read_text())
          assert d["schema"] == "pi-coalition-externality-heterogeneous-impact/v0.1"
          assert d["self_checks_passed"] == 18
          assert d["starting_equilibria"] == ["CD", "NONE"]
          assert d["aggregate_welfare_neutral_E_damage"] == 11.4
          r = {v["E_damage_if_targeted"]: v for v in d["selected_rows"]}
          assert r[20]["join_minus_no_join"] == -8.6
          assert r[20]["coalition_still_private_nash_under_fixed_incentives"] is True
          assert "strategic_reoptimization_after_E_damage_known" in d["not_claimed"]
          print("Fixed-strategy E-damage sensitivity PASS; NOT a full endogenous game or independent replication")
          PY
