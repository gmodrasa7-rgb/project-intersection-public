name: Coalition externality probe

on:
  pull_request:
    paths:
      - "experiments/coalition_externality_probe/**"
      - ".github/workflows/coalition-externality-probe.yml"
      - "PUBLIC_EVIDENCE_INDEX.md"
  push:
    branches: [main]
    paths:
      - "experiments/coalition_externality_probe/**"
      - ".github/workflows/coalition-externality-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deterministic self-checks and result receipt
        run: |
          python experiments/coalition_externality_probe/probe.py --verify > /tmp/pi-coalition-externality.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/pi-coalition-externality.json").read_text())
          assert data["self_checks_passed"] == 65
          assert data["counts"] == {
              "total": 10,
              "member_select": 9,
              "aggregate_select": 8,
              "guard_admissible": 3,
              "guard_blocked": 6,
              "guard_unresolved": 1,
          }
          print("RESULT: project-authored deterministic synthetic probe PASS")
          PY

      - name: Run partial-identification and role-reversal finite oracle (v0.2)
        run: |
          python experiments/coalition_externality_probe/partial_identification_audit_v02.py > /tmp/pi-coalition-v02.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/pi-coalition-v02.json").read_text(encoding="utf-8"))
          assert data["finite_states_tested"] == 108864
          assert data["formula_oracle_disagreements"] == 0
          assert data["member_identity_swap_disagreements"] == 0
          w = data["unregistered_actor_witness"]
          assert w["observed"] == {"A": 4, "B": 4, "C": 0}
          assert w["completion_D_plus5_all_nonnegative"] is True
          assert w["completion_D_minus50_all_nonnegative"] is False
          assert data["old_v01_masking_observations"] == {
              "member_loss_c_missing": "UNRESOLVED",
              "exit_c_missing": "UNRESOLVED",
          }
          # The frozen v0.1 decisions remain recorded; unknown affected
          # scope cannot be promoted to a positive v0.2 clearance.
          from collections import Counter
          legacy = data["legacy_v01_reassessment_open_scope"]
          assert len(legacy) == 10 and len({r["id"] for r in legacy}) == 10
          assert Counter(r["legacy_v01_guard"] for r in legacy) == {
              "ADMISSIBLE": 3, "BLOCKED": 6, "UNRESOLVED": 1,
          }
          assert Counter(r["v02_open_scope_guard"] for r in legacy) == {
              "UNRESOLVED": 4, "BLOCKED": 6,
          }
          assert all(r["affected_scope_complete"] is None for r in legacy)
          changed = {r["id"] for r in legacy
                     if r["legacy_v01_guard"] != r["v02_open_scope_guard"]}
          assert changed == {"win_all", "consented_bounded_loss",
                             "zero_member_incentive"}
          assert all(r["legacy_v01_guard"] == "ADMISSIBLE"
                     and r["v02_open_scope_guard"] == "UNRESOLVED"
                     for r in legacy if r["id"] in changed)
          print("Legacy v0.1 -> v0.2 open-scope reassessment PASS; 3 positive claims downgraded")
          cases = {x["case"]: x["classification"] for x in data["focused_cases"]}
          assert cases["known_member_loss_hidden_by_missing_C"] == "BLOCKED"
          assert cases["known_exit_block_hidden_by_missing_C"] == "BLOCKED"
          assert cases["positive_C_but_unverified_affected_register"] == "UNRESOLVED"
          assert cases["unknown_C_bounded_nonnegative"] == "ADMISSIBLE"
          assert cases["known_unavoidable_C_loss"] == "BLOCKED"
          print("v0.2 finite-world self-audit PASS; only project-authored synthetic evidence")
          PY
