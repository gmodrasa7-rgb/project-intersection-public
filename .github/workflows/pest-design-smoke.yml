name: PEST candidate design smoke (not a research result)

on:
  pull_request:
    paths:
      - "experiments/pest_v0_1/**"
      - ".github/workflows/pest-design-smoke.yml"
  push:
    branches: [main]
    paths:
      - "experiments/pest_v0_1/**"
      - ".github/workflows/pest-design-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate candidate design only
        run: |
          python experiments/pest_v0_1/pest.py --validate-only
          python -m unittest discover -s experiments/pest_v0_1 -p 'test_*.py' -v
