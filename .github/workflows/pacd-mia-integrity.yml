name: PACD-MIA source/claim provenance guard
on:
  pull_request:
    paths:
      - "research/PI_PACD_MIA*"
      - "tools/pacd_mia_audit.py"
      - "tests/test_pacd_mia_audit.py"
      - ".github/workflows/pacd-mia-integrity.yml"
  push:
    paths:
      - "research/PI_PACD_MIA*"
      - "tools/pacd_mia_audit.py"
      - "tests/test_pacd_mia_audit.py"
      - ".github/workflows/pacd-mia-integrity.yml"
permissions:
  contents: read
jobs:
  provenance-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify paired source boundaries
        run: python tools/pacd_mia_audit.py
      - name: Negative regression tests
        run: python -m unittest discover -s tests -p "test_pacd_mia_audit.py" -v
