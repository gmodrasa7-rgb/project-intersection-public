name: E009 preregistration and result reproduction audit

on:
  pull_request:
    paths:
      - "experiments/e009/**"
      - ".github/workflows/e009-prereg-audit.yml"
  push:
    branches: [main]
    paths:
      - "experiments/e009/**"
      - ".github/workflows/e009-prereg-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-e009:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python experiments/e009/validate.py
      - name: Validate or reproduce E009
        run: |
          if [ -f experiments/e009/RESULT.json ]; then
            python experiments/e009/verify_result.py
          else
            python experiments/e009/benchmark.py --validate-only
          fi

      - name: Audit original E009 decision-level denominator, complete family roster and LOFO influence (posthoc)
        run: |
          if [ -f experiments/e009/RESULT.json ]; then
            python experiments/e009/paired_observation_audit.py --family-audit > /tmp/e009-family-audit.json
            python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('/tmp/e009-family-audit.json').read_text())
          assert a['status'] == 'E009_POSTHOC_DESCRIPTIVE_FAMILY_UNIT_AUDIT_ONLY'
          assert a['independent_validation'] is False
          assert a['family_count'] == 16
          assert a['per_policy_unique_decisions'] == 3200
          assert a['per_policy_metric_rows'] == 9600
          assert all(a['mutation_controls'].values())
          assert len(a['leave_one_family_out']) == 16
          assert a['severe_harm_gate_interpretation']['observed_excess_events'] == 53
          assert a['severe_harm_gate_interpretation']['preregistered_criterion_passed'] is True
          print('LOFO Project-v3 regret worse than MINIMAL_4VAR: original', a['original_loo_project_worse_than_minimal4'], '/16; common-noise', a['common_noise_loo_project_worse_than_minimal4'], '/16')
          print('LOFO original regret deltas V3-minus-M4:', [round(x['original']['project_minus_minimal4_mean_regret'], 6) for x in a['leave_one_family_out']])
          print('LOFO common-noise regret deltas V3-minus-M4:', [round(x['common_noise']['project_minus_minimal4_mean_regret'], 6) for x in a['leave_one_family_out']])
          print('E009 FAMILY-UNIT AUDIT PASS: original result unchanged, 16 LOFO, 3200 decisions not 9600 independent, 53 synthetic excess harm events under passing 2pp gate')
          print('Scope: deterministic PROJECT-LINEAGE posthoc synthetic audit, not external or empirical validation')
          PY
          fi
