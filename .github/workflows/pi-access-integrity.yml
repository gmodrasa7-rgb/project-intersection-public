name: PI-ACCESS public entry integrity
on:
  pull_request:
    paths:
      - "README.md"
      - ".github/ACCESSIBILITY.md"
      - "navigation/ACCESS_MAP_EN.md"
      - "navigation/ACCESS_MAP_KO.md"
      - "navigation/START_HERE_EN.md"
      - "navigation/START_HERE_KO.md"
      - "tools/audit_pi_access.py"
      - ".github/workflows/pi-access-integrity.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/ACCESSIBILITY.md"
      - "navigation/ACCESS_MAP_EN.md"
      - "navigation/ACCESS_MAP_KO.md"
      - "navigation/START_HERE_EN.md"
      - "navigation/START_HERE_KO.md"
      - "tools/audit_pi_access.py"
      - ".github/workflows/pi-access-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-false-navigation-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail on broken task paths and inaccessible navigation regressions
        run: python tools/audit_pi_access.py --self-test
